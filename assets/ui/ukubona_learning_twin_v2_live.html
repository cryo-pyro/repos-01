
<div style="font-family: var(--font-mono); padding: 1rem 0;">

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 1.5rem;">
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px;">twin id</div>
    <div style="font-size: 13px; font-weight: 500; color: var(--color-text-primary);">P-NON-3175</div>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px;">top dx</div>
    <div style="font-size: 13px; font-weight: 500; color: var(--color-text-primary);" id="top-dx">aquagenic</div>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px;">confidence</div>
    <div style="font-size: 13px; font-weight: 500; color: var(--color-text-primary);" id="top-conf">60%</div>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
    <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px;">updates</div>
    <div style="font-size: 13px; font-weight: 500; color: var(--color-text-primary);" id="update-count">0</div>
  </div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
  <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem;">
    <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 12px; letter-spacing: 0.05em;">belief state θₜ</div>
    <div id="belief-bars"></div>
  </div>
  <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem;">
    <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 8px; letter-spacing: 0.05em;">belief evolution L(θ)</div>
    <div style="position: relative; height: 160px;">
      <canvas id="evoChart"></canvas>
    </div>
  </div>
</div>

<div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; margin-bottom: 1rem;">
  <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 8px; letter-spacing: 0.05em;">push observation → ∇L  <span id="llm-badge" style="margin-left: 8px; font-size: 10px; padding: 2px 8px; border-radius: 4px; background: var(--color-background-info); color: var(--color-text-info);">claude gradient computer</span></span></div>
  <div style="display: flex; gap: 8px; margin-bottom: 8px;">
    <input type="text" id="obs-input" placeholder="describe symptom, trigger, image finding, lab result..." style="flex: 1; font-family: var(--font-mono); font-size: 12px;" />
    <select id="modality" style="font-size: 12px; font-family: var(--font-mono); width: auto; padding: 0 8px;">
      <option value="0.2">text η=0.2</option>
      <option value="0.5">image η=0.5</option>
      <option value="0.8">lab η=0.8</option>
      <option value="1.0">biopsy η=1.0</option>
    </select>
    <button id="compute-btn" onclick="pushUpdate()" style="font-family: var(--font-mono); font-size: 12px; padding: 0 16px;">∇ compute</button>
  </div>
  <div style="display: flex; gap: 6px; flex-wrap: wrap;">
    <button onclick="quickObs('itch after cold shower, no visible rash or wheals')" style="font-size: 11px; padding: 4px 10px; font-family: var(--font-mono);">cold shower + itch</button>
    <button onclick="quickObs('hives appeared, red welts on forearms, urticarial plaques')" style="font-size: 11px; padding: 4px 10px; font-family: var(--font-mono);">hives on arms</button>
    <button onclick="quickObs('JAK2 V617F positive, hematocrit 58%, splenomegaly on ultrasound')" style="font-size: 11px; padding: 4px 10px; font-family: var(--font-mono);">JAK2+ lab</button>
    <button onclick="quickObs('dry cracked skin on shins, no water trigger, worse in winter')" style="font-size: 11px; padding: 4px 10px; font-family: var(--font-mono);">dry skin only</button>
    <button onclick="resetTwin()" style="font-size: 11px; padding: 4px 10px; font-family: var(--font-mono); color: var(--color-text-danger);">↺ reset</button>
  </div>
</div>

<div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem;">
  <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 8px; letter-spacing: 0.05em;">reasoning trace // claude's ∇L explanation</div>
  <div id="trace-log" style="font-size: 11px; color: var(--color-text-secondary); max-height: 160px; overflow-y: auto; line-height: 1.9;"></div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DIAGNOSES = {
  aquagenic_pruritus: { label: 'aquagenic pruritus', color: '#378ADD' },
  urticaria:          { label: 'urticaria',           color: '#D85A30' },
  xerosis:            { label: 'xerosis',             color: '#888780' },
  polycythemia_vera:  { label: 'polycythemia vera',   color: '#7F77DD' }
};

let state = { aquagenic_pruritus: 0.60, urticaria: 0.10, xerosis: 0.20, polycythemia_vera: 0.10 };
let updateCount = 0;

const SYSTEM_PROMPT = `You are the Ukubona Gradient Computer. Your sole job is to compute a diagnostic gradient vector from a patient observation.

The current DDx space has exactly 4 diagnoses:
- aquagenic_pruritus
- urticaria
- xerosis
- polycythemia_vera

Given a patient observation, return ONLY valid JSON with this exact structure:
{
  "gradient": {
    "aquagenic_pruritus": <float between -1 and 1>,
    "urticaria": <float between -1 and 1>,
    "xerosis": <float between -1 and 1>,
    "polycythemia_vera": <float between -1 and 1>
  },
  "reasoning": "<one sentence explaining the key signal>"
}

Rules:
- Positive values shift belief TOWARD that diagnosis
- Negative values shift belief AWAY from it
- Magnitudes reflect evidence strength (0.05 = weak hint, 0.5 = strong signal, 0.9 = near-pathognomonic)
- The gradient vector does NOT need to sum to zero
- No markdown, no preamble, no explanation outside the JSON object`;

function normalize(s) {
  const total = Object.values(s).reduce((a, b) => a + b, 0);
  const out = {};
  for (const k in s) out[k] = Math.max(0, s[k]) / total;
  return out;
}

function applyGradient(grad, eta) {
  const next = {};
  for (const k in state) next[k] = state[k] + eta * (grad[k] || 0);
  return normalize(next);
}

async function callClaude(observation) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{ role: 'user', content: observation }]
    })
  });
  const data = await response.json();
  const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

function renderBars() {
  const sorted = Object.entries(state).sort((a, b) => b[1] - a[1]);
  document.getElementById('belief-bars').innerHTML = sorted.map(([k, v]) => {
    const d = DIAGNOSES[k];
    return `<div style="margin-bottom: 8px;">
      <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px;">
        <span style="color: var(--color-text-secondary);">${d.label}</span>
        <span style="font-weight: 500; color: var(--color-text-primary);">${(v * 100).toFixed(1)}%</span>
      </div>
      <div style="height: 4px; background: var(--color-border-tertiary); border-radius: 2px;">
        <div style="height: 4px; width: ${(v * 100).toFixed(1)}%; background: ${d.color}; border-radius: 2px; transition: width 0.6s ease;"></div>
      </div>
    </div>`;
  }).join('');
}

function renderMetrics() {
  const top = Object.entries(state).sort((a, b) => b[1] - a[1])[0];
  document.getElementById('top-dx').textContent = DIAGNOSES[top[0]].label.split(' ')[0];
  document.getElementById('top-conf').textContent = (top[1] * 100).toFixed(0) + '%';
  document.getElementById('update-count').textContent = updateCount;
}

const evoCtx = document.getElementById('evoChart');
const evoChart = new Chart(evoCtx, {
  type: 'line',
  data: {
    labels: ['t₀'],
    datasets: Object.entries(DIAGNOSES).map(([k, d]) => ({
      label: d.label,
      data: [state[k]],
      borderColor: d.color,
      backgroundColor: 'transparent',
      borderWidth: 1.5,
      pointRadius: 2,
      tension: 0.4
    }))
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      y: { min: 0, max: 1, ticks: { font: { family: 'monospace', size: 10 }, callback: v => (v * 100).toFixed(0) + '%' }, grid: { color: 'rgba(128,128,128,0.1)' } },
      x: { ticks: { font: { family: 'monospace', size: 10 } }, grid: { display: false } }
    }
  }
});

function updateChart() {
  evoChart.data.labels.push('t' + updateCount);
  evoChart.data.datasets.forEach((ds, i) => {
    ds.data.push(Object.values(state)[i]);
  });
  evoChart.update();
}

function addTrace(obs, eta, grad, reasoning) {
  const log = document.getElementById('trace-log');
  const shifts = Object.entries(grad)
    .filter(([, v]) => Math.abs(v) > 0.01)
    .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
    .map(([k, v]) => `${v > 0 ? '↑' : '↓'} ${DIAGNOSES[k].label} (${v > 0 ? '+' : ''}${v.toFixed(2)})`)
    .join(' · ');
  const line = document.createElement('div');
  line.style.borderBottom = '0.5px solid var(--color-border-tertiary)';
  line.style.paddingBottom = '6px';
  line.style.marginBottom = '6px';
  line.innerHTML = `<span style="color: var(--color-text-tertiary);">[t${updateCount} η=${eta}]</span> ${reasoning}<br><span style="color: var(--color-text-tertiary); font-size: 10px;">${shifts}</span>`;
  log.prepend(line);
}

function setLoading(loading) {
  const btn = document.getElementById('compute-btn');
  btn.textContent = loading ? '⟳ computing...' : '∇ compute';
  btn.disabled = loading;
}

async function pushUpdate() {
  const input = document.getElementById('obs-input');
  const obs = input.value.trim();
  if (!obs) return;
  const eta = parseFloat(document.getElementById('modality').value);
  setLoading(true);
  try {
    const result = await callClaude(obs);
    state = applyGradient(result.gradient, eta);
    updateCount++;
    addTrace(obs, eta, result.gradient, result.reasoning);
    renderBars();
    renderMetrics();
    updateChart();
    input.value = '';
  } catch (e) {
    const log = document.getElementById('trace-log');
    const err = document.createElement('div');
    err.style.color = 'var(--color-text-danger)';
    err.textContent = 'API error: ' + e.message;
    log.prepend(err);
  }
  setLoading(false);
}

function quickObs(text) {
  document.getElementById('obs-input').value = text;
  pushUpdate();
}

function resetTwin() {
  state = { aquagenic_pruritus: 0.60, urticaria: 0.10, xerosis: 0.20, polycythemia_vera: 0.10 };
  updateCount = 0;
  evoChart.data.labels = ['t₀'];
  evoChart.data.datasets.forEach((ds, i) => { ds.data = [Object.values(state)[i]]; });
  evoChart.update();
  document.getElementById('trace-log').innerHTML = '';
  renderBars();
  renderMetrics();
}

renderBars();
renderMetrics();
</script>
